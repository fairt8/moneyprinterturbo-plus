name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README*.md"
      - "docs/**"
      - ".github/workflows/docker-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DOCKER_BUILD_MIRROR=default
            PIP_USE_OFFICIAL=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on Oracle
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pull and restart this Compose project
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_APP_DIR: ${{ vars.ORACLE_APP_DIR }}
        run: |
          if [ -z "${ORACLE_HOST}" ] || [ -z "${ORACLE_USER}" ] || [ -z "${ORACLE_SSH_KEY}" ]; then
            echo "ORACLE_HOST, ORACLE_USER, or ORACLE_SSH_KEY is unset. Skipping deploy."
            exit 0
          fi
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${ORACLE_SSH_KEY}" > "${HOME}/.ssh/oracle_deploy"
          chmod 600 "${HOME}/.ssh/oracle_deploy"
          ssh -i "${HOME}/.ssh/oracle_deploy" \
            -o StrictHostKeyChecking=accept-new \
            "${ORACLE_USER}@${ORACLE_HOST}" \
            "APP_DIR=$(printf '%q' "${ORACLE_APP_DIR}") bash -s" <<'REMOTE'
          set -eu
          cd "${APP_DIR:-$HOME/moneyprinterturbo}"
          docker compose -p moneyprinterturbo pull
          docker compose -p moneyprinterturbo up -d --remove-orphans
          REMOTE
          rm -f "${HOME}/.ssh/oracle_deploy"
